<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will Garbutt - Links</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #4e3954;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            width: 300px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
        }
        .avatar-icon {
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 40px solid #8E24AA;
        }
        h1, p {
            margin: 5px 0;
        }
        .social-icons {
            margin: 20px 0;
        }
        .social-icons a {
            color: white;
            text-decoration: none;
            margin: 0 5px;
        }
        .btn {
            display: block;
            background-color: white;
            color: #8E24AA;
            text-decoration: none;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .credit {
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">
            <div class="avatar-icon"></div>
        </div>
        <h1>Will Garbutt</h1>
        <p></p>
        <p>will@will-garbutt.me</p>
        <div class="social-icons">
            <a href="#">FB</a>
            <a href="#">IG</a>
            <a href="#">TW</a>
            <a href="#">DR</a>
            <a href="#">IN</a>
        </div>
        <a href="#" class="btn">Read my Resume</a>
        <a href="#" class="btn">Read My Blog - Stuffabout.cloud</a>
        <a href="#" class="btn">View my repos - Github</a>
    </div>
</body>
</html>
